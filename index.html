<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pub Philosophy & Café Philosophy — informal, democratic philosophical inquiry in London, Geneva, Machynlleth, and online.">
  <link rel="canonical" href="https://www.pubphilosophy.uk/">
  <title>Pub Philosophy : Natural Philosophy</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fdfbf7;
      background-image:
        radial-gradient(circle at 80% 20%, rgba(217, 119, 6, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 20% 75%, rgba(15, 118, 110, 0.08) 0%, transparent 50%);
      user-select: none;
      -webkit-user-select: none;
    }

    /* Floating UI Header */
    .ui-header {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 20;
      pointer-events: none;
      max-width: 440px;
    }

    .ui-header__title {
      font-size: 1.45rem;
      font-weight: 900;
      color: #1c1917;
      letter-spacing: -0.02em;
    }

    .ui-header__desc {
      font-size: 0.78rem;
      color: #57534e;
      margin-top: 0.3rem;
      line-height: 1.45;
    }

    .speed-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      padding: 1px 8px;
      border-radius: 9999px;
      margin-left: 4px;
    }

    /* Background Canvas */
    #canvas-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
    }

    /* Elastic Mind Map Layer */
    #interactive-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    #svg-connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .connection-line {
      stroke: #94a3b8;
      stroke-width: 2.5px;
      stroke-dasharray: 5 5;
      fill: none;
      opacity: 0.75;
    }

    /* Node Wrapper & Positioning */
    .node {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: auto;
      will-change: transform;
      transition: opacity 0.25s ease;
    }

    .node.is-collapsed {
      opacity: 0;
      pointer-events: none;
    }

    .node.is-dragging {
      z-index: 50;
      cursor: grabbing;
    }

    /* Main 3D Sphere */
    .sphere {
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 3px solid #d97706;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .sphere:hover {
      transform: translate(-50%, -50%) scale(1.04);
    }

    .sphere:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    .sphere--lg {
      width: 220px;
      height: 220px;
      font-size: 1.35rem;
      color: #000000;
    }

    .theme-natphil {
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #fef08a 32%, #fcd34d 72%, #d97706 100%);
      box-shadow:
        0 20px 40px -10px rgba(217, 119, 6, 0.4),
        inset 0 -8px 18px rgba(146, 64, 14, 0.35);
    }

    .theme-natphil::after {
      content: '';
      position: absolute;
      top: 12%;
      left: 16%;
      width: 34%;
      height: 18%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 50%;
      transform: rotate(-32deg);
      pointer-events: none;
    }

    .sphere__glyph {
      font-size: 2.8rem;
      line-height: 1;
      margin-bottom: 6px;
      color: #000000;
    }

    .sphere__label {
      color: #000000;
      font-weight: 800;
      line-height: 1.15;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
    }

    /* Sub-Bubble Chips */
    .chip {
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.35rem;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
      border-width: 2.5px;
      border-style: solid;
      box-shadow:
        0 10px 22px -5px rgba(0, 0, 0, 0.14),
        inset 0 2px 4px rgba(255, 255, 255, 0.8);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
    }

    .chip:hover {
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 14px 26px -4px rgba(0, 0, 0, 0.2);
    }

    .chip--amber {
      background: radial-gradient(circle at 30% 25%, #ffffff 0%, #fef08a 45%, #fde047 100%);
      border-color: #ca8a04;
      color: #713f12;
    }

    .chip--orange {
      background: radial-gradient(circle at 30% 25%, #ffffff 0%, #fed7aa 45%, #fdba74 100%);
      border-color: #ea580c;
      color: #7c2d12;
    }

    .chip--amberdeep {
      background: radial-gradient(circle at 30% 25%, #ffffff 0%, #fde68a 45%, #fbbf24 100%);
      border-color: #b45309;
      color: #78350f;
    }

    /* Hover Tooltip */
    #ball-tooltip {
      position: fixed;
      z-index: 30;
      max-width: 290px;
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid #d97706;
      border-radius: 12px;
      padding: 0.65rem 0.9rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    #ball-tooltip.hidden {
      display: none;
    }

    .tooltip-title {
      font-size: 0.86rem;
      font-weight: 800;
      color: #1c1917;
      line-height: 1.3;
    }

    .tooltip-latin {
      font-size: 0.76rem;
      font-style: italic;
      color: #b45309;
      margin-top: 2px;
    }

    .tooltip-cat {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #78716c;
      margin-top: 3px;
    }

    /* Detail Modal Card */
    .idea-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }

    .idea-modal-backdrop.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    .idea-modal-card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 2px solid #d97706;
      overflow: hidden;
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .idea-modal-backdrop.is-active .idea-modal-card {
      transform: scale(1);
    }

    .idea-modal-image {
      width: 100%;
      height: 250px;
      object-fit: contain;
      background-color: #f8fafc;
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .idea-modal-body {
      padding: 1.4rem;
    }

    .idea-modal-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      padding: 3px 10px;
      border-radius: 9999px;
      margin-bottom: 0.5rem;
    }

    .idea-modal-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }

    .idea-modal-latin {
      font-size: 0.9rem;
      font-style: italic;
      color: #b45309;
      margin-top: 0.2rem;
      margin-bottom: 0.75rem;
    }

    .idea-modal-desc {
      font-size: 0.875rem;
      line-height: 1.55;
      color: #475569;
      margin-bottom: 1.25rem;
    }

    .idea-modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #e2e8f0;
      padding-top: 0.95rem;
    }

    .idea-modal-link {
      font-size: 0.85rem;
      font-weight: 700;
      color: #b45309;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .idea-modal-link:hover {
      text-decoration: underline;
    }

    .idea-modal-close-btn {
      background: #f1f5f9;
      border: none;
      color: #475569;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .idea-modal-close-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <!-- Floating UI Header -->
  <header class="ui-header">
    <h1 class="ui-header__title">Pub Philosophy : Natural Philosophy</h1>
    <p class="ui-header__desc">
      Click the central sphere to <strong>expand / collapse</strong> pages. Click any floating philosopher to inspect &amp; open Wikipedia. Click background to cycle speed:
      <span id="speed-indicator" class="speed-badge">Moderate</span>
    </p>
  </header>

  <!-- Hover Tooltip -->
  <div id="ball-tooltip" class="hidden">
    <div id="tooltip-title" class="tooltip-title"></div>
    <div id="tooltip-latin" class="tooltip-latin"></div>
    <div id="tooltip-category" class="tooltip-cat"></div>
  </div>

  <!-- Detail Modal Card -->
  <div id="idea-modal" class="idea-modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="idea-modal-card">
      <img id="modal-img" class="idea-modal-image" src="" alt="Philosopher">
      <div class="idea-modal-body">
        <span id="modal-category" class="idea-modal-badge">Philosopher</span>
        <h2 id="modal-title" class="idea-modal-title">Name</h2>
        <div id="modal-latin" class="idea-modal-latin">Dates / Tradition</div>
        <p id="modal-desc" class="idea-modal-desc">Summary.</p>
        <div class="idea-modal-footer">
          <a id="modal-link" class="idea-modal-link" href="#" target="_blank" rel="noopener noreferrer">Wikipedia Page →</a>
          <button id="modal-close" class="idea-modal-close-btn" type="button">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Background Physics Canvas -->
  <canvas id="canvas-bg"></canvas>

  <!-- Elastic Graph Mind Map Layer -->
  <main id="interactive-map">
    <svg id="svg-connections"></svg>
  </main>

  <noscript>
    <nav style="position:fixed;bottom:1rem;left:1rem;z-index:50;font-size:0.875rem">
      <a href="events.html">Events</a> ·
      <a href="what-is-it.html">What It Is</a> ·
      <a href="history-philosophy.html">History</a>
    </nav>
  </noscript>

  <script src="audio.js"></script>
  <script>
    const BOOK_ICON = `<span class="sphere__glyph" aria-hidden="true">💬</span>`;

    const GRAPH = [
      {
        id: 'natphil', size: 'sphere--lg', theme: 'theme-natphil', anchor: [0.50, 0.50],
        aria: 'Natural Philosophy',
        html: `${BOOK_ICON}<span class="sphere__label">Natural<br>Philosophy</span>`,
        children: [
          { id: 'natphil-events',  label: 'Events',     href: 'events.html',             chip: 'chip--amber' },
          { id: 'natphil-what',    label: 'What It Is', href: 'what-is-it.html',         chip: 'chip--orange' },
          { id: 'natphil-history', label: 'History',    href: 'history-philosophy.html', chip: 'chip--amberdeep' }
        ]
      }
    ];

    const TOOLTIP_TEXT = {
      natphil: "Informal, open philosophical inquiry outside academic walls—in London, Geneva, Machynlleth, and online."
    };

    const ballTooltip = document.getElementById('ball-tooltip');

    function showBallTooltip(id, e, data) {
      const titleEl = document.getElementById('tooltip-title');
      const latinEl = document.getElementById('tooltip-latin');
      const catEl = document.getElementById('tooltip-category');
      if (!ballTooltip || !titleEl) return;

      if (data && typeof data === 'object') {
        titleEl.textContent = data.name || '';
        if (latinEl) latinEl.textContent = data.subtitle || '';
        if (catEl) catEl.textContent = data.category || '';
      } else if (TOOLTIP_TEXT[id]) {
        titleEl.textContent = TOOLTIP_TEXT[id];
        if (latinEl) latinEl.textContent = '';
        if (catEl) catEl.textContent = 'Interactive Hub';
      }

      ballTooltip.style.opacity = '1';
      ballTooltip.classList.remove('hidden');

      let x = null, y = null;
      if (e && typeof e.clientX === 'number' && isFinite(e.clientX)) {
        x = e.clientX;
        y = e.clientY;
      } else if (nodes.get(id) && nodes.get(id).body) {
        const rect = nodes.get(id).body.getBoundingClientRect();
        x = rect.left + rect.width / 2;
        y = rect.top + rect.height / 2;
      }
      if (x !== null && y !== null) positionBallTooltip(x, y);
    }

    function hideBallTooltip() {
      if (!ballTooltip) return;
      ballTooltip.classList.add('hidden');
      ballTooltip.style.opacity = '0';
    }

    function positionBallTooltip(x, y) {
      const pad = 12;
      const ttW = Math.min(290, window.innerWidth - 2 * pad);
      let left = x + 14;
      let top = y + 14;
      if (left + ttW > window.innerWidth - pad) left = x - ttW - 14;
      if (top + 70 > window.innerHeight - pad) top = y - 70 - 14;
      ballTooltip.style.left = left + 'px';
      ballTooltip.style.top = top + 'px';
    }

    // Modal Controller
    const modalBackdrop = document.getElementById('idea-modal');
    const modalImg = document.getElementById('modal-img');
    const modalCat = document.getElementById('modal-category');
    const modalTitle = document.getElementById('modal-title');
    const modalLatin = document.getElementById('modal-latin');
    const modalDesc = document.getElementById('modal-desc');
    const modalLink = document.getElementById('modal-link');
    const modalClose = document.getElementById('modal-close');
    let isModalOpen = false;

    function openModal(data) {
      if (!data) return;
      isModalOpen = true;
      hideBallTooltip();
      modalImg.src = data.largeImg || data.imgUrl || '';
      modalCat.textContent = data.category || '';
      modalTitle.textContent = data.name || '';
      modalLatin.textContent = data.subtitle || '';
      modalDesc.textContent = data.description || '';
      if (data.detailUrl) {
        modalLink.href = data.detailUrl;
        modalLink.style.display = 'inline-flex';
      } else {
        modalLink.style.display = 'none';
      }
      modalBackdrop.classList.add('is-active');
      modalBackdrop.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      isModalOpen = false;
      modalBackdrop.classList.remove('is-active');
      modalBackdrop.setAttribute('aria-hidden', 'true');
    }

    modalClose.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', e => {
      if (e.target === modalBackdrop) closeModal();
    });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && isModalOpen) closeModal();
    });

    // --- Mind Map Physics & Nodes ---
    const PHYS = {
      repel: 3.2, repelPad: 45,
      stiffChild: 0.055, gapChild: 64,
      damping: 0.87, maxSpeed: 46,
      anchorPull: 0.0022, restitution: 0.45, wallPad: 12
    };

    let screenW = window.innerWidth;
    let screenH = window.innerHeight;
    const nodes = new Map();
    const edges = [];
    const expanded = new Set();
    const map = document.getElementById('interactive-map');
    const svg = document.getElementById('svg-connections');
    const SVG_NS = 'http://www.w3.org/2000/svg';

    function buildNode(cfg, parentId) {
      const wrap = document.createElement('div');
      wrap.className = 'node' + (parentId ? ' is-collapsed' : '');
      wrap.id = 'node-' + cfg.id;
      const isRoot = !parentId;
      const body = document.createElement(isRoot ? 'button' : 'a');

      if (isRoot) {
        body.type = 'button';
        body.className = `node__body sphere ${cfg.size} ${cfg.theme}`;
        body.setAttribute('aria-expanded', 'false');
        body.setAttribute('aria-label', cfg.aria);
        body.innerHTML = cfg.html;
        body.dataset.nodeId = cfg.id;
      } else {
        body.href = cfg.href;
        body.className = `node__body chip ${cfg.chip}`;
        body.setAttribute('draggable', 'false');
        body.textContent = cfg.label;
        body.dataset.nodeId = cfg.id;
      }

      wrap.appendChild(body);
      if (parentId) wrap.setAttribute('inert', '');
      map.appendChild(wrap);

      nodes.set(cfg.id, {
        id: cfg.id, el: wrap, body,
        x: 0, y: 0, vx: 0, vy: 0, r: isRoot ? 110 : 32,
        active: isRoot, isRoot, parent: parentId || null,
        invMass: isRoot ? 0.45 : 1,
        anchor: cfg.anchor || null
      });

      attachPointer(cfg.id, body, wrap, isRoot);
    }

    GRAPH.forEach(root => {
      buildNode(root, null);
      root.children.forEach(child => buildNode(child, root.id));
      edges.push(...root.children.map(c => ({ from: root.id, to: c.id, kind: 'child' })));
    });

    edges.forEach(edge => {
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('class', 'connection-line');
      svg.appendChild(path);
      edge.pathEl = path;
    });

    function measureNodes() {
      nodes.forEach(n => { n.r = Math.max(26, n.body.offsetWidth / 2); });
    }

    function layoutInitial() {
      nodes.forEach(n => {
        if (n.isRoot) {
          n.x = screenW * n.anchor[0];
          n.y = screenH * n.anchor[1];
        } else {
          const p = nodes.get(n.parent);
          n.x = p.x; n.y = p.y;
        }
        n.vx = n.vy = 0;
      });
    }

    function toggleCluster(rootId, silent = false) {
      const root = nodes.get(rootId);
      const kids = GRAPH.find(g => g.id === rootId).children.map(c => nodes.get(c.id));
      const isOpen = expanded.has(rootId);
      root.body.setAttribute('aria-expanded', String(!isOpen));

      if (isOpen) {
        if (!silent && typeof playBoing === 'function') playBoing();
        expanded.delete(rootId);
        kids.forEach(k => {
          k.active = false;
          k.el.classList.add('is-collapsed');
          k.el.setAttribute('inert', '');
        });
        return;
      }

      if (!silent && typeof playSwish === 'function') playSwish();
      expanded.add(rootId);
      kids.forEach((k, i) => {
        k.active = true;
        k.x = root.x;
        k.y = root.y;
        const spread = (i / kids.length) * Math.PI * 2 - Math.PI / 2;
        k.vx = Math.cos(spread) * 26;
        k.vy = Math.sin(spread) * 26;
        k.el.classList.remove('is-collapsed');
        k.el.removeAttribute('inert');
      });
    }

    let drag = null;
    let suppressClick = false;

    function attachPointer(id, body, wrap, isRoot) {
      body.addEventListener('dragstart', e => e.preventDefault());

      body.addEventListener('pointerdown', e => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        const n = nodes.get(id);
        suppressClick = false;
        drag = {
          id,
          ox: n.x - e.clientX, oy: n.y - e.clientY,
          lastX: e.clientX, lastY: e.clientY,
          startX: e.clientX, startY: e.clientY,
          moved: false
        };
        wrap.classList.add('is-dragging');
        try { body.setPointerCapture(e.pointerId); } catch (_) {}
      });

      body.addEventListener('pointermove', e => {
        if (!drag || drag.id !== id) return;
        if (!drag.moved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 6) {
          drag.moved = true;
        }
        const n = nodes.get(id);
        n.x = e.clientX + drag.ox;
        n.y = e.clientY + drag.oy;
        n.vx = e.clientX - drag.lastX;
        n.vy = e.clientY - drag.lastY;
        drag.lastX = e.clientX;
        drag.lastY = e.clientY;
      });

      const endDrag = e => {
        if (!drag || drag.id !== id) return;
        suppressClick = drag.moved;
        wrap.classList.remove('is-dragging');
        try { body.releasePointerCapture(e.pointerId); } catch (_) {}
        drag = null;
      };

      body.addEventListener('pointerup', endDrag);
      body.addEventListener('pointercancel', endDrag);

      body.addEventListener('click', e => {
        e.stopPropagation();
        if (suppressClick) {
          e.preventDefault();
          suppressClick = false;
          return;
        }
        if (isRoot) {
          e.preventDefault();
          toggleCluster(id);
        } else {
          if (typeof playWoop === 'function') playWoop();
        }
      });
    }

    function simulate(dt) {
      if (isModalOpen) return;
      const list = [...nodes.values()].filter(n => n.active);

      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          const a = list[i], b = list[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.hypot(dx, dy) || 0.01;
          const minDist = a.r + b.r + PHYS.repelPad;
          if (dist >= minDist) continue;
          const f = ((minDist - dist) / minDist) * PHYS.repel * dt;
          const nx = dx / dist, ny = dy / dist;
          if (!drag || drag.id !== a.id) { a.vx -= nx * f * a.invMass; a.vy -= ny * f * a.invMass; }
          if (!drag || drag.id !== b.id) { b.vx += nx * f * b.invMass; b.vy += ny * f * b.invMass; }
        }
      }

      edges.forEach(edge => {
        const a = nodes.get(edge.from), b = nodes.get(edge.to);
        if (!a.active || !b.active) return;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.01;
        const rest = a.r + b.r + PHYS.gapChild;
        const f = (dist - rest) * PHYS.stiffChild * dt;
        const fx = (dx / dist) * f, fy = (dy / dist) * f;
        if (!drag || drag.id !== a.id) { a.vx += fx * a.invMass; a.vy += fy * a.invMass; }
        if (!drag || drag.id !== b.id) { b.vx -= fx * b.invMass; b.vy -= fy * b.invMass; }
      });

      const damp = Math.pow(PHYS.damping, dt);
      list.forEach(n => {
        if (drag && drag.id === n.id) return;
        if (n.isRoot) {
          n.vx += (screenW * n.anchor[0] - n.x) * PHYS.anchorPull * dt;
          n.vy += (screenH * n.anchor[1] - n.y) * PHYS.anchorPull * dt;
        }
        n.vx *= damp;
        n.vy *= damp;
        const speed = Math.hypot(n.vx, n.vy);
        if (speed > PHYS.maxSpeed) {
          n.vx = (n.vx / speed) * PHYS.maxSpeed;
          n.vy = (n.vy / speed) * PHYS.maxSpeed;
        }
        n.x += n.vx * dt;
        n.y += n.vy * dt;

        const pad = n.r + PHYS.wallPad;
        if (n.x < pad)                { n.x = pad;                n.vx = Math.abs(n.vx) * PHYS.restitution; }
        else if (n.x > screenW - pad) { n.x = screenW - pad;     n.vx = -Math.abs(n.vx) * PHYS.restitution; }
        if (n.y < pad)                { n.y = pad;                n.vy = Math.abs(n.vy) * PHYS.restitution; }
        else if (n.y > screenH - pad) { n.y = screenH - pad;     n.vy = -Math.abs(n.vy) * PHYS.restitution; }
      });
    }

    function renderGraph() {
      nodes.forEach(n => {
        n.el.style.transform = `translate3d(${n.x}px, ${n.y}px, 0)`;
      });

      edges.forEach(edge => {
        const a = nodes.get(edge.from);
        const b = nodes.get(edge.to);
        if (!a || !b || !a.active || !b.active) {
          edge.pathEl.style.display = 'none';
          return;
        }
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = dx / dist;
        const ny = dy / dist;

        const startX = a.x + nx * Math.min(a.r - 2, dist * 0.4);
        const startY = a.y + ny * Math.min(a.r - 2, dist * 0.4);
        const endX   = b.x - nx * Math.min(b.r - 2, dist * 0.4);
        const endY   = b.y - ny * Math.min(b.r - 2, dist * 0.4);

        edge.pathEl.style.display = 'block';
        edge.pathEl.setAttribute('d', `M ${startX} ${startY} L ${endX} ${endY}`);
      });
    }

    // --- 4. FLOATING PHILOSOPHERS (100%) ---

    const preloaded = {};
    function preload(url) {
      if (!preloaded[url]) {
        const img = new Image();
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.src = url;
        preloaded[url] = img;
      }
      return preloaded[url];
    }

    philosophersDb.forEach(d => {
      preload(d.imgUrl);
      if (d.largeImg) preload(d.largeImg);
    });

    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let cw = window.innerWidth, ch = window.innerHeight;

    function sizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cw = window.innerWidth;
      ch = window.innerHeight;
      canvas.width = Math.round(cw * dpr);
      canvas.height = Math.round(ch * dpr);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const speedLevels = [
      { label: 'Stopped',    mult: 0.0 },
      { label: 'Slow Float', mult: 0.4 },
      { label: 'Moderate',   mult: 1.0 }
    ];
    let speedIndex = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 2;

    class IdeaCard {
      constructor(forcedData = null) {
        this.radius = Math.random() * 7 + 23;
        this.mass = this.radius;
        this.x = Math.random() * (cw - this.radius * 2) + this.radius;
        this.y = Math.random() * (ch - this.radius * 2) + this.radius;
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 1.4 + 1.1;
        this.vx = Math.cos(a) * s;
        this.vy = Math.sin(a) * s;

        this.data = forcedData || philosophersDb[Math.floor(Math.random() * philosophersDb.length)];
        this.img = preload(this.data.imgUrl);
      }

      update(dt) {
        if (isModalOpen) return;
        const m = speedLevels[speedIndex].mult;
        if (m === 0) return;
        this.x += this.vx * m * dt;
        this.y += this.vy * m * dt;
        if (this.x - this.radius <= 0)       { this.x = this.radius;      this.vx = Math.abs(this.vx); }
        else if (this.x + this.radius >= cw) { this.x = cw - this.radius; this.vx = -Math.abs(this.vx); }
        if (this.y - this.radius <= 0)       { this.y = this.radius;      this.vy = Math.abs(this.vy); }
        else if (this.y + this.radius >= ch) { this.y = ch - this.radius; this.vy = -Math.abs(this.vy); }
      }

      draw() {
        const w = this.radius * 1.95;
        const h = this.radius * 2.25;
        const x = this.x - w / 2;
        const y = this.y - h / 2;

        ctx.save();
        ctx.globalAlpha = 0.95;

        // White Card Base with Soft Shadow
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.16)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 2;
        ctx.fillRect(x, y, w, h);
        ctx.shadowColor = 'transparent';

        if (this.img && this.img.complete && this.img.naturalWidth) {
          ctx.drawImage(this.img, x + 3, y + 3, w - 6, h - 6);
        } else {
          // Framed Monogram Fallback if image is still loading
          ctx.fillStyle = '#fef3c7';
          ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
          ctx.fillStyle = '#78350f';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const initials = this.data.name.split(' ').map(s => s[0]).join('');
          ctx.fillText(initials, this.x, this.y);
        }

        // Framed Card Border
        ctx.lineWidth = 2.0;
        ctx.strokeStyle = '#d97706';
        ctx.strokeRect(x, y, w, h);

        ctx.restore();
      }
    }

    sizeCanvas();

    // Seed 28 floating philosopher portrait cards (2 of each of the 14 thinkers)
    const cards = Array.from({ length: 28 }, (_, idx) => new IdeaCard(philosophersDb[idx % philosophersDb.length]));

    function resolveCardCollisions() {
      if (isModalOpen || speedLevels[speedIndex].mult === 0) return;
      for (let i = 0; i < cards.length; i++) {
        for (let j = i + 1; j < cards.length; j++) {
          const b1 = cards[i], b2 = cards[j];
          const dx = b2.x - b1.x, dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);
          if (dist >= b1.radius + b2.radius) continue;
          const overlap = b1.radius + b2.radius - dist;
          const nx = dx / (dist || 1), ny = dy / (dist || 1);
          b1.x -= nx * overlap * 0.5; b1.y -= ny * overlap * 0.5;
          b2.x += nx * overlap * 0.5; b2.y += ny * overlap * 0.5;
          const kx = b1.vx - b2.vx, ky = b1.vy - b2.vy;
          const p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);
          b1.vx -= p * b2.mass * nx; b1.vy -= p * b2.mass * ny;
          b2.vx += p * b1.mass * nx; b2.vy += p * b1.mass * ny;
        }
      }
    }

    let lastFrame = performance.now();
    function frame(now) {
      let dt = (now - lastFrame) / 16.6667;
      lastFrame = now;
      dt = Math.max(0.2, Math.min(dt, 3));

      ctx.clearRect(0, 0, cw, ch);
      resolveCardCollisions();
      cards.forEach(c => { c.update(dt); c.draw(); });
      simulate(dt);
      renderGraph();
      requestAnimationFrame(frame);
    }

    measureNodes();
    layoutInitial();
    renderGraph();
    requestAnimationFrame(frame);

    // Auto-expand the Natural Philosophy children on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (!expanded.has('natphil')) toggleCluster('natphil', true);
      }, 350);
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      screenW = window.innerWidth;
      screenH = window.innerHeight;
      sizeCanvas();
      cards.forEach(c => {
        c.x = Math.min(Math.max(c.x, c.radius), cw - c.radius);
        c.y = Math.min(Math.max(c.y, c.radius), ch - c.radius);
      });
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(measureNodes, 120);
    });

    // Hover Tooltip Detection (Nodes + Floating Cards)
    window.addEventListener('mousemove', e => {
      if (drag || isModalOpen) { hideBallTooltip(); return; }

      const el = document.elementFromPoint(e.clientX, e.clientY);
      const body = el && el.closest && el.closest('.node__body');
      if (body && body.dataset && body.dataset.nodeId) {
        const id = body.dataset.nodeId;
        if (nodes.get(id) && nodes.get(id).isRoot) {
          showBallTooltip(id, e);
        } else {
          hideBallTooltip();
        }
        return;
      }

      let hit = null;
      for (let i = cards.length - 1; i >= 0; i--) {
        if (Math.hypot(cards[i].x - e.clientX, cards[i].y - e.clientY) <= cards[i].radius * 1.15) {
          hit = cards[i];
          break;
        }
      }

      if (hit) {
        canvas.style.cursor = 'pointer';
        showBallTooltip(null, e, hit.data);
      } else {
        canvas.style.cursor = 'default';
        hideBallTooltip();
      }
    }, { passive: true });

    const speedIndicator = document.getElementById('speed-indicator');
    if (speedIndicator) {
      speedIndicator.textContent = speedLevels[speedIndex].label;
    }

    // Click Handler: Open Philosopher Modal or Cycle Speed
    window.addEventListener('click', e => {
      if (isModalOpen || e.target.closest('.node') || e.target.closest('.idea-modal-card')) return;

      let clickedCard = null;
      for (let i = cards.length - 1; i >= 0; i--) {
        if (Math.hypot(cards[i].x - e.clientX, cards[i].y - e.clientY) <= cards[i].radius * 1.15) {
          clickedCard = cards[i];
          break;
        }
      }

      if (clickedCard && clickedCard.data) {
        if (typeof playWoop === 'function') playWoop();
        openModal(clickedCard.data);
        return;
      }

      speedIndex = (speedIndex + 1) % speedLevels.length;
      if (speedIndicator) {
        speedIndicator.textContent = speedLevels[speedIndex].label;
      }
      cards.forEach(c => {
        const dx = c.x - e.clientX, dy = c.y - e.clientY;
        const dist = Math.hypot(dx, dy) || 1;
        const force = Math.min(15, 250 / dist);
        c.vx += (dx / dist) * force;
        c.vy += (dy / dist) * force;
      });
    });
  </script>
